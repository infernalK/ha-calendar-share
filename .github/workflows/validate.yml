name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  # hacs/action runs the same checks HACS uses to review a submission to
  # its default (official) store. Installing via "HACS > Custom
  # repositories" does not require these to pass. The "brands" check in
  # particular only passes once icons are submitted to
  # home-assistant/brands, which only matters if/when this repository is
  # submitted to the default store - so it is allowed to fail here.
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        continue-on-error: true
        with:
          category: integration
